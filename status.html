<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CT Open Decks · Sign-ups</title>
<meta name="description" content="Whether CT Open Decks sign-ups are open right now.">
<meta name="theme-color" content="#2e045c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232e045c'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%238fa3e0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e59ad0'/%3E%3C/svg%3E">
<link rel="preload" href="CT-Open-Decks.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'CT Open Decks';
    src: url('CT-Open-Decks.ttf') format('truetype');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    /* The darkest purple in background.jpg, shown while it loads. */
    --bg: #2e045c;
    /* Boxes are solid, so the background never shows through the text. */
    --card: #251344;
    --line: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --accent: #8fa3e0;
    --ink: #1a1424;
    --ok: #9be3b8;
    --font-display: 'CT Open Decks', 'Arial Black', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; font-size: clamp(100%, calc(39% + 0.89vw), 140%); }
  body {
    margin: 0;
    min-height: 100vh;
    font: 400 1rem/1.5 var(--font-body);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  /* The background picture, fixed behind the page. */
  body::before {
    content: ''; position: fixed; z-index: -1; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh;
    background: var(--bg) url('background.jpg') center / cover no-repeat;
  }
  /* Embedded on another site (status?embedded): no background or logo of its own. */
  .embedded body { min-height: 0; background: transparent; }
  .embedded body::before, .embedded .logo { display: none; }

  .wrap { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  .embedded .wrap { padding: 0.25rem; }
  .logo { display: block; width: auto; max-width: min(100%, 15rem); max-height: 8rem; margin: 0 auto 1.25rem; }

  .status {
    padding: 1rem 1.25rem; border-radius: 1rem; border: 1px solid var(--line); background: var(--card);
    text-align: center;
  }
  .status.open { border-color: rgba(155, 227, 184, 0.55); }
  .status h2 { margin: 0; font: 700 1.25rem/1.2 var(--font-display); }
  .status.open h2 { color: var(--ok); }
  /* The message in your website's own text style (Space Grotesk), so it reads as part of the page. */
  .status p { margin: 0.25rem auto 0; max-width: 46ch; color: #fafafa; font: 600 0.9375rem/1.6 'Space Grotesk', var(--font-body); }
  .btn {
    display: inline-block; margin-top: 0.875rem; padding: 0.75rem 2rem;
    border-radius: 62.4375rem; background: #fff; color: var(--ink);
    font-size: 0.9375rem; font-weight: 600; text-decoration: none;
    transition: background-color 0.15s;
  }
  .btn:hover { background: var(--accent); }
  @media (max-width: 560px) {
    .status { padding: 0.75rem 1rem; }
    .status h2 { font-size: 1.0625rem; }
    .status p { font-size: 0.875rem; }
    .btn { margin-top: 0.625rem; padding: 0.625rem 1.75rem; font-size: 0.875rem; }
  }
</style>
<script>
  if (new URLSearchParams(location.search).has('embedded')) document.documentElement.classList.add('embedded');
</script>
</head>
<body>
<main class="wrap">
  <img class="logo" src="logo.png" alt="CT Open Decks">
  <!-- Whether sign-ups are open right now, filled in from the sheet. -->
  <div class="status" id="status" role="status" aria-live="polite"><p>Checking sign-ups…</p></div>
</main>

<script>
const CONFIG = {
  // The same Apps Script web app URL as index.html (it ends in /exec).
  apiUrl: 'https://script.google.com/macros/s/AKfycbwZntnJesyS-5fPQT9PHJyThZiSTxXhL__geIVGaDWVkGVpOe7ROJcwM9jBscPxTZfdYQ/exec',
  // Where the Sign up button goes: your website's sign-up page, or with ?form the sign-up form itself.
  signupPage: 'https://www.ctopendecks.com/signup',
  signupForm: new URL('./', location.href).href,
  // How often it checks for changes while open, in minutes.
  refreshMinutes: 5,
};

const $ = (id) => document.getElementById(id);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August',
  'September', 'October', 'November', 'December'];
const buttonLink = new URLSearchParams(location.search).has('form') ? CONFIG.signupForm : CONFIG.signupPage;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

// '2026-12-09' → "December 9th", as the sign-up page writes it.
function showDay(day) {
  const [, month, date] = day.split('-').map(Number);
  const suffix = date >= 11 && date <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][date % 10] || 'th';
  return `${MONTH_NAMES[month - 1]} ${date}${suffix}`;
}

// Worded like the sign-up page: open (slots left and a Sign up button), all slots filled
// (next month opens in person at the show first), or closed.
function render(next) {
  const box = $('status');
  const open = next && next.signups === 'open';
  box.className = open ? 'status open' : 'status';
  if (!next) {
    box.replaceChildren(el('h2', '', 'Sign-ups are closed'), el('p', '', 'New dates coming soon.'));
  } else if (open) {
    const [, month, date] = next.day.split('-').map(Number);
    const left = `${next.openSlots} of ${next.total} slot${next.total === 1 ? '' : 's'} left for ${MONTHS[month - 1]} ${date}`;
    const button = el('a', 'btn', 'Sign up');
    button.href = buttonLink;
    // Leaves the embed and opens in the whole window.
    button.target = '_top';
    box.replaceChildren(el('h2', '', 'Sign-ups are open'), el('p', '', left), button);
  } else if (next.signups === 'full') {
    box.replaceChildren(
      el('h2', '', 'All slots filled.'),
      el('p', '', `Sign-ups for next month will be available in-person at the next event on ${showDay(next.day)} before opening online. Online sign-ups open at 5am the next day.`),
    );
  } else {
    box.replaceChildren(el('h2', '', 'Sign-ups are closed'), el('p', '', 'Check back soon for the next one.'));
  }
}

let loaded = false;
async function load() {
  try {
    const res = await fetch(`${CONFIG.apiUrl}?mode=events`, { cache: 'no-store' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message);
    render(data.shows[0]);
    loaded = true;
  } catch (err) {
    console.error(err);
    // A failed check keeps what's on screen.
    if (!loaded) $('status').replaceChildren(el('p', '', "Couldn't check sign-ups. Try again in a minute."));
  }
}

// Embedded: tells the page around it how tall to make the box, so nothing is cut off.
function reportHeight() {
  if (!document.documentElement.classList.contains('embedded') || window.parent === window) return;
  window.parent.postMessage({ ctodStatusHeight: Math.ceil(document.querySelector('.wrap').scrollHeight) }, '*');
}
new ResizeObserver(reportHeight).observe(document.querySelector('.wrap'));

load();
setInterval(() => { if (document.visibilityState === 'visible') load(); }, CONFIG.refreshMinutes * 60000);
</script>
</body>
</html>
