<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="darkreader-lock">
<title>CT Open Decks · Sign-ups</title>
<meta name="description" content="Whether CT Open Decks sign-ups are open right now.">
<meta name="theme-color" content="#2e045c">

<style>
  @font-face {
    font-family: 'CT Open Decks';
    src: url('CT-Open-Decks.ttf') format('truetype');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    /* The darkest purple in background.jpg, shown while it loads. */
    --bg: #2e045c;
    /* Boxes are solid, so the background never shows through the text. */
    --card: #251344;
    --line: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --accent: #8fa3e0;
    --ink: #1a1424;
    --yellow: #ffde00;
    --lilac: #c4adff;
    --ok: #9be3b8;
    --font-display: 'CT Open Decks', 'Arial Black', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* 30% bigger than the other pages; everything in the widget is sized from this. */
  html { -webkit-text-size-adjust: 100%; font-size: clamp(130%, calc(50.7% + 1.157vw), 182%); }
  body {
    margin: 0;
    min-height: 100vh;
    font: 400 1rem/1.5 var(--font-body);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  /* The background picture, fixed behind the page. */
  body::before {
    content: ''; position: fixed; z-index: -1; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh;
    background: var(--bg) url('background.jpg') center / cover no-repeat;
  }
  /* Embedded on another site (status?embedded): no background or logo of its own. */
  .embedded body { min-height: 0; background: transparent; }
  .embedded body::before, .embedded .logo { display: none; }

  .wrap { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  /* Embedded, the box sits in the middle of the embed, whatever height you give it. */
  .embedded, .embedded body { height: 100%; }
  .embedded .wrap { min-height: 100%; padding: 0.25rem; display: flex; flex-direction: column; justify-content: center; }
  .logo { display: block; width: auto; max-width: min(100%, 15rem); max-height: 8rem; margin: 0 auto 1.25rem; }

  .status {
    padding: 1rem 1.25rem; border-radius: 1rem; border: 1px solid var(--yellow); background: var(--card);
    text-align: center;
  }
  .status h2 { margin: 0; font: 700 1.25rem/1.2 var(--font-display); }
  .status.open h2 { color: var(--ok); }
  /* The message in your website's own text style (Space Grotesk), so it reads as part of the page. */
  .status p { margin: 0.25rem auto 0; max-width: 46ch; color: #fafafa; font: 600 0.9375rem/1.6 'Space Grotesk', var(--font-body); }
  .loading p { display: flex; align-items: center; justify-content: center; gap: 0.75rem; font-size: 1.0625rem; }
  .loading .jog { width: 2.5rem; height: 2.5rem; }
  /* While it checks, a small box in the middle of the embed. */
  .status.loading { width: fit-content; max-width: 100%; margin: 0 auto; }
  .btn {
    display: inline-block; margin-top: 0.875rem; padding: 0.75rem 2rem;
    border-radius: 62.4375rem; background: var(--lilac); color: var(--ink);
    font-size: 0.9375rem; font-weight: 600; text-decoration: none;
    transition: background-color 0.15s;
  }
  .btn:hover { background: #ddd0ff; }
  button.btn { border: 0; cursor: pointer; font-family: inherit; }
  /* The first step of your website's Sign Up page (status?embedded&flow): the page's own box is
     around it, so no box here, and Sign up starts the steps on that page. */
  .flow .status { border: 0; background: transparent; }
  @media (max-width: 560px) {
    .status { padding: 0.75rem 1rem; }
    .status h2 { font-size: 1.0625rem; }
    .status p { font-size: 0.875rem; }
    .btn { margin-top: 0.625rem; padding: 0.625rem 1.75rem; font-size: 0.875rem; }
  }
  /* A spinning purple jog wheel, like a CDJ's, shown whenever something is loading. */
  .jog {
    position: relative; display: inline-block; flex: none; width: 2rem; height: 2rem; border-radius: 50%;
    vertical-align: middle; box-shadow: 0 0.125rem 0.375rem rgba(0, 0, 0, 0.5);
  }
  .jog::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='r'><stop offset='.72' stop-color='%23341470'/><stop offset='.88' stop-color='%23240b52'/><stop offset='1' stop-color='%23100426'/></radialGradient><radialGradient id='b' cx='.38' cy='.32' r='.75'><stop offset='0' stop-color='%23b291ff'/><stop offset='.45' stop-color='%235f2fb8'/><stop offset='1' stop-color='%231a0740'/></radialGradient><radialGradient id='p' cx='.42' cy='.36' r='.7'><stop offset='0' stop-color='%23441c88'/><stop offset='.7' stop-color='%23260c56'/><stop offset='1' stop-color='%23170636'/></radialGradient><radialGradient id='h' cx='.4' cy='.35' r='.7'><stop offset='0' stop-color='%23552aa6'/><stop offset='1' stop-color='%23240b52'/></radialGradient></defs><circle cx='50' cy='50' r='49.5' fill='url(%23r)'/><circle cx='50.00' cy='7.40' r='4.7' fill='url(%23b)'/><circle cx='61.03' cy='8.85' r='4.7' fill='url(%23b)'/><circle cx='71.30' cy='13.11' r='4.7' fill='url(%23b)'/><circle cx='80.12' cy='19.88' r='4.7' fill='url(%23b)'/><circle cx='86.89' cy='28.70' r='4.7' fill='url(%23b)'/><circle cx='91.15' cy='38.97' r='4.7' fill='url(%23b)'/><circle cx='92.60' cy='50.00' r='4.7' fill='url(%23b)'/><circle cx='91.15' cy='61.03' r='4.7' fill='url(%23b)'/><circle cx='86.89' cy='71.30' r='4.7' fill='url(%23b)'/><circle cx='80.12' cy='80.12' r='4.7' fill='url(%23b)'/><circle cx='71.30' cy='86.89' r='4.7' fill='url(%23b)'/><circle cx='61.03' cy='91.15' r='4.7' fill='url(%23b)'/><circle cx='50.00' cy='92.60' r='4.7' fill='url(%23b)'/><circle cx='38.97' cy='91.15' r='4.7' fill='url(%23b)'/><circle cx='28.70' cy='86.89' r='4.7' fill='url(%23b)'/><circle cx='19.88' cy='80.12' r='4.7' fill='url(%23b)'/><circle cx='13.11' cy='71.30' r='4.7' fill='url(%23b)'/><circle cx='8.85' cy='61.03' r='4.7' fill='url(%23b)'/><circle cx='7.40' cy='50.00' r='4.7' fill='url(%23b)'/><circle cx='8.85' cy='38.97' r='4.7' fill='url(%23b)'/><circle cx='13.11' cy='28.70' r='4.7' fill='url(%23b)'/><circle cx='19.88' cy='19.88' r='4.7' fill='url(%23b)'/><circle cx='28.70' cy='13.11' r='4.7' fill='url(%23b)'/><circle cx='38.97' cy='8.85' r='4.7' fill='url(%23b)'/><circle cx='50' cy='50' r='37' fill='%230e0322'/><circle cx='50' cy='50' r='35.6' fill='url(%23p)'/><circle cx='50' cy='50' r='15' fill='url(%23h)' stroke='%230e0322' stroke-width='1.5'/><circle cx='50' cy='50' r='15.8' fill='none' stroke='%239a74ef' stroke-opacity='.55' stroke-width='.8'/><rect x='48.8' y='17' width='2.4' height='8' rx='1.2' fill='%23c4adff'/></svg>") center / 100% 100% no-repeat;
    animation: jog-spin 1.6s linear infinite;
  }
  /* The shine stays put while the wheel turns under it. */
  .jog::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 26%, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0) 42%),
      radial-gradient(circle at 70% 80%, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0) 55%);
  }
  @keyframes jog-spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .jog::before { animation-duration: 6s; } }
  /* Smaller, inside a button. */
  button .jog { width: 1.25rem; height: 1.25rem; margin: 0 0.5rem 0 0; vertical-align: -0.25em; }
</style>
<script>
  if (new URLSearchParams(location.search).has('embedded')) document.documentElement.classList.add('embedded');
  if (new URLSearchParams(location.search).has('flow')) document.documentElement.classList.add('flow');
</script>
</head>
<body>
<main class="wrap">
  <img class="logo" src="logo.png" alt="CT Open Decks">
  <!-- Whether sign-ups are open right now, filled in from the sheet. -->
  <div class="status loading" id="status" role="status" aria-live="polite"><p><span class="jog" aria-hidden="true"></span>Checking sign-ups…</p></div>
</main>

<script>
const CONFIG = {
  // The same Apps Script web app URL as index.html (it ends in /exec).
  apiUrl: 'https://script.google.com/macros/s/AKfycbwZntnJesyS-5fPQT9PHJyThZiSTxXhL__geIVGaDWVkGVpOe7ROJcwM9jBscPxTZfdYQ/exec',
  // Where the Sign up button goes: your website's sign-up page, or with ?form the sign-up form itself.
  // On the new website (and its test address) that's its own Sign Up page. From the old GitHub
  // address, which the Squarespace site embeds, it's www.ctopendecks.com/signup.
  signupPage: location.hostname.endsWith('github.io') ? 'https://www.ctopendecks.com/signup' : new URL('/signup', location.href).href,
  signupForm: new URL('./', location.href).href,
  // How often it checks for changes while open, in minutes.
  refreshMinutes: 5,
};

const $ = (id) => document.getElementById(id);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August',
  'September', 'October', 'November', 'December'];
const buttonLink = new URLSearchParams(location.search).has('form') ? CONFIG.signupForm : CONFIG.signupPage;
// On your website's Sign Up page the button starts the steps there instead of going anywhere.
const FLOW = document.documentElement.classList.contains('flow');
const toPage = (message) => { if (window.parent !== window) window.parent.postMessage(message, '*'); };

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

// '2026-12-09' → "December 9th", as the sign-up page writes it.
function showDay(day) {
  const [, month, date] = day.split('-').map(Number);
  const suffix = date >= 11 && date <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][date % 10] || 'th';
  return `${MONTH_NAMES[month - 1]} ${date}${suffix}`;
}

// Worded like the sign-up page: open (slots left and a Sign up button), all slots filled
// (next month opens in person at the show first), or closed.
// Eases in something that's just appeared after loading, like the sign-up panel opening does.
function appear(node) {
  if (!node || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  node.animate([{ opacity: 0, transform: 'translateY(0.5rem)' }, { opacity: 1, transform: 'none' }],
    { duration: 320, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
}

function render(next) {
  const box = $('status');
  if (box.classList.contains('loading')) requestAnimationFrame(() => appear(box));
  const open = next && next.signups === 'open';
  box.className = open ? 'status open' : 'status';
  if (!next) {
    box.replaceChildren(el('h2', '', 'Sign-ups are closed'), el('p', '', 'New dates coming soon.'));
  } else if (open) {
    const [, month, date] = next.day.split('-').map(Number);
    const left = `${next.openSlots} of ${next.total} slot${next.total === 1 ? '' : 's'} left for ${MONTHS[month - 1]} ${date}`;
    let button;
    if (FLOW) {
      button = el('button', 'btn', 'Sign up');
      button.type = 'button';
      button.addEventListener('click', () => toPage({ ctodSignupStart: true }));
    } else {
      button = el('a', 'btn', 'Sign up');
      button.href = buttonLink;
      // Leaves the embed and opens in the whole window.
      button.target = '_top';
    }
    box.replaceChildren(el('h2', '', 'Sign-ups are open'), el('p', '', left), button);
  } else if (next.signups === 'full') {
    box.replaceChildren(
      el('h2', '', 'All slots filled.'),
      el('p', '', `Sign-ups for next month will be available in-person at the next event on ${showDay(next.day)} before opening online. Online sign-ups open at 5am the next day.`),
    );
  } else {
    box.replaceChildren(el('h2', '', 'Sign-ups are closed'), el('p', '', 'Check back soon for the next one.'));
  }
}

let loaded = false;
async function load() {
  try {
    const res = await fetch(`${CONFIG.apiUrl}?mode=events`, { cache: 'no-store' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message);
    render(data.shows[0]);
    toPage({ ctodSignupState: data.shows[0] ? data.shows[0].signups : 'closed' });
    loaded = true;
  } catch (err) {
    console.error(err);
    // A failed check keeps what's on screen.
    if (!loaded) $('status').replaceChildren(el('p', '', "Couldn't check sign-ups. Try again in a minute."));
  }
  fit();
}

// Embedded: tells the page around it how tall the box wants to be, and if the embed is shorter
// than that (a narrow phone, or bigger text settings), shrinks everything until it fits, so the
// bottom is never cut off.
function fit() {
  const root = document.documentElement;
  if (!root.classList.contains('embedded')) return;
  const box = $('status');
  const needed = () => Math.ceil(box.getBoundingClientRect().height) + 8;
  root.style.fontSize = '';
  if (window.parent !== window) window.parent.postMessage({ ctodStatusHeight: needed() }, '*');
  let size = parseFloat(getComputedStyle(root).fontSize);
  while (needed() > innerHeight && size > 10) {
    size *= 0.95;
    root.style.fontSize = `${size}px`;
  }
}
addEventListener('resize', fit);
// The text gets a little taller once the fonts arrive.
document.fonts.ready.then(fit);
fit();

load();
setInterval(() => { if (document.visibilityState === 'visible') load(); }, CONFIG.refreshMinutes * 60000);
</script>
</body>
</html>
