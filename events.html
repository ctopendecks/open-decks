<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Tells the Dark Reader browser extension to leave the colors alone; the page is already dark. -->
<meta name="darkreader-lock">
<title>CT Open Decks · Upcoming Events</title>
<meta name="description" content="Upcoming CT Open Decks shows.">
<meta name="theme-color" content="#2e045c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232e045c'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%238fa3e0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e59ad0'/%3E%3C/svg%3E">
<link rel="preload" href="CT-Open-Decks.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'CT Open Decks';
    src: url('CT-Open-Decks.ttf') format('truetype');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    /* The darkest purple in background.jpg, shown while it loads. */
    --bg: #2e045c;
    /* Boxes are solid, so the background never shows through the text. */
    --card: #251344;
    --line: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
    --accent: #8fa3e0;
    --yellow: #ffde00;
    --ink: #1a1424;
    --ok: #9be3b8;
    --font-display: 'CT Open Decks', 'Arial Black', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Grows a little on wide screens, like the sign-up page. */
  html { -webkit-text-size-adjust: 100%; font-size: clamp(100%, calc(39% + 0.89vw), 140%); }
  body {
    margin: 0;
    min-height: 100vh;
    font: 400 1rem/1.5 var(--font-body);
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  /* The background picture, fixed behind the page. */
  body::before {
    content: ''; position: fixed; z-index: -1; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh;
    background: var(--bg) url('background.jpg') center / cover no-repeat;
  }
  /* Embedded on another site (events?embedded): no background or heading of its own. */
  .embedded body { min-height: 0; background: transparent; }
  .embedded body::before, .embedded header { display: none; }

  .wrap { max-width: 68rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  header { text-align: center; }
  .logo { display: block; width: auto; max-width: min(100%, 15rem); max-height: 8rem; margin: 0 auto 1.25rem; }
  h1 { margin: 0; font: 700 clamp(1.75rem, 6vw, 2.75rem)/1.1 var(--font-display); }

  /* One column on phones, two on tablets, three on desktops. */
  .shows { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: 1rem; margin: 2rem 0 0; padding: 0; list-style: none; }
  .show {
    display: flex; gap: 1rem; align-items: center; padding: 1.25rem;
    border-radius: 1rem; border: 1px solid var(--yellow); background: var(--card);
  }
  .text { min-width: 0; }
  /* The date as a calendar tile. */
  .day {
    flex: none; display: grid; place-items: center; width: 4.25rem; height: 4.25rem; border-radius: 0.875rem;
    background: var(--yellow); color: var(--ink); text-align: center;
  }
  .day b { display: block; font: 700 0.8125rem/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; }
  /* The day number fills the rest of the tile. */
  .day span { display: block; margin-top: 0.125rem; font: 700 2.5rem/0.9 var(--font-display); }
  .session { margin: 0; font: 700 1.375rem/1.15 var(--font-display); }
  .when { margin: 0.25rem 0 0; color: rgba(255, 255, 255, 0.86); font-weight: 500; }
  .when .short, .where .short { display: none; }
  .when .long { white-space: nowrap; }
  /* Its own line on bigger screens, after the date on phones. */
  .when .time { display: block; color: var(--muted); font-size: 0.875rem; }
  .where { margin: 0.375rem 0 0; color: var(--muted); font-size: 0.875rem; }

  /* Compact rows: on phones, and always when embedded on another site. */
  .compact .wrap { padding: 1.25rem 0.75rem 2rem; }
  .compact .logo { max-height: 5rem; margin-bottom: 0.75rem; }
  .compact h1 { font-size: 1.5rem; }
  /* Two across on bigger screens, one on phones. */
  .compact .shows { grid-template-columns: repeat(auto-fill, minmax(max(15rem, calc((100% - 0.5rem) / 2)), 1fr)); gap: 0.5rem; margin-top: 0.5rem; }
  .compact .show { gap: 0.75rem; padding: 0.625rem 0.875rem; border-radius: 0.75rem; }
  .compact .day { width: 3rem; height: 3rem; border-radius: 0.625rem; }
  .compact .day b { font-size: 0.625rem; }
  .compact .day span { margin-top: 0.0625rem; font-size: 1.75rem; }
  .compact .session { font-size: 1rem; }
  .compact .when { margin-top: 0.125rem; font-size: 0.875rem; }
  .compact .when .long, .compact .where .long { display: none; }
  .compact .when .short, .compact .where .short { display: inline; }
  .compact .when .time { display: inline; color: inherit; font-size: inherit; white-space: nowrap; }
  .compact .when .time::before { content: ' · '; }
  .compact .where { margin-top: 0.125rem; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Embedded, the page keeps its size and scrolls inside the box rather than growing past it. */
  .embedded, .embedded body { height: 100%; }
  .embedded .wrap { height: 100%; overflow-y: auto; padding: 0.25rem 1.25rem 0.25rem 0.25rem; scrollbar-width: none; }
  .embedded .wrap::-webkit-scrollbar { display: none; }
  /* Its own scrollbar, purple and always showing while there are more dates to scroll to. */
  .scrollbar {
    position: fixed; top: 0.25rem; bottom: 0.25rem; right: 0.125rem; width: 0.625rem; border-radius: 99rem;
    background: rgba(196, 173, 255, 0.25); cursor: pointer; touch-action: none;
  }
  .thumb {
    position: absolute; left: 0; right: 0; border-radius: 99rem;
    background: #a47cf5; box-shadow: 0 0 0 1px rgba(26, 20, 36, 0.6), 0 0 0.5rem rgba(164, 124, 245, 0.6);
  }
  /* "Loading dates…" and other notes, in your website's text style. */
  .message {
    margin: 2rem auto 0; max-width: 30rem; padding: 1.25rem; border-radius: 1rem; border: 1px solid var(--yellow); background: var(--card);
    text-align: center; color: #fafafa; font: 600 0.9375rem/1.6 'Space Grotesk', var(--font-body);
  }
  .footnote { margin: 1rem 0 0; text-align: center; color: #fafafa; font: 600 0.9375rem/1.6 'Space Grotesk', var(--font-body); }
  .compact .message { margin-top: 0.5rem; padding: 0.875rem; font-size: 0.875rem; }
  .compact .footnote { margin-top: 0.625rem; font-size: 0.8125rem; }
  /* Embedded, the dates start right at the top of the box. */
  .embedded .shows, .embedded .message { margin-top: 0; }
  /* While the dates load, the message sits in the middle of the box. */
  .embedded .wrap.loading { display: flex; flex-direction: column; justify-content: center; }
  /* Bigger while loading, with a bigger jog wheel. */
  .loading .message { display: flex; align-items: center; justify-content: center; gap: 0.875rem; font-size: 1.25rem; }
  .loading .message .jog { width: 3rem; height: 3rem; }
  /* A spinning purple jog wheel, like a CDJ's, shown whenever something is loading. */
  .jog {
    position: relative; display: inline-block; flex: none; width: 2rem; height: 2rem; border-radius: 50%;
    vertical-align: middle; box-shadow: 0 0.125rem 0.375rem rgba(0, 0, 0, 0.5);
  }
  .jog::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='r'><stop offset='.72' stop-color='%23341470'/><stop offset='.88' stop-color='%23240b52'/><stop offset='1' stop-color='%23100426'/></radialGradient><radialGradient id='b' cx='.38' cy='.32' r='.75'><stop offset='0' stop-color='%23b291ff'/><stop offset='.45' stop-color='%235f2fb8'/><stop offset='1' stop-color='%231a0740'/></radialGradient><radialGradient id='p' cx='.42' cy='.36' r='.7'><stop offset='0' stop-color='%23441c88'/><stop offset='.7' stop-color='%23260c56'/><stop offset='1' stop-color='%23170636'/></radialGradient><radialGradient id='h' cx='.4' cy='.35' r='.7'><stop offset='0' stop-color='%23552aa6'/><stop offset='1' stop-color='%23240b52'/></radialGradient></defs><circle cx='50' cy='50' r='49.5' fill='url(%23r)'/><circle cx='50.00' cy='7.40' r='4.7' fill='url(%23b)'/><circle cx='61.03' cy='8.85' r='4.7' fill='url(%23b)'/><circle cx='71.30' cy='13.11' r='4.7' fill='url(%23b)'/><circle cx='80.12' cy='19.88' r='4.7' fill='url(%23b)'/><circle cx='86.89' cy='28.70' r='4.7' fill='url(%23b)'/><circle cx='91.15' cy='38.97' r='4.7' fill='url(%23b)'/><circle cx='92.60' cy='50.00' r='4.7' fill='url(%23b)'/><circle cx='91.15' cy='61.03' r='4.7' fill='url(%23b)'/><circle cx='86.89' cy='71.30' r='4.7' fill='url(%23b)'/><circle cx='80.12' cy='80.12' r='4.7' fill='url(%23b)'/><circle cx='71.30' cy='86.89' r='4.7' fill='url(%23b)'/><circle cx='61.03' cy='91.15' r='4.7' fill='url(%23b)'/><circle cx='50.00' cy='92.60' r='4.7' fill='url(%23b)'/><circle cx='38.97' cy='91.15' r='4.7' fill='url(%23b)'/><circle cx='28.70' cy='86.89' r='4.7' fill='url(%23b)'/><circle cx='19.88' cy='80.12' r='4.7' fill='url(%23b)'/><circle cx='13.11' cy='71.30' r='4.7' fill='url(%23b)'/><circle cx='8.85' cy='61.03' r='4.7' fill='url(%23b)'/><circle cx='7.40' cy='50.00' r='4.7' fill='url(%23b)'/><circle cx='8.85' cy='38.97' r='4.7' fill='url(%23b)'/><circle cx='13.11' cy='28.70' r='4.7' fill='url(%23b)'/><circle cx='19.88' cy='19.88' r='4.7' fill='url(%23b)'/><circle cx='28.70' cy='13.11' r='4.7' fill='url(%23b)'/><circle cx='38.97' cy='8.85' r='4.7' fill='url(%23b)'/><circle cx='50' cy='50' r='37' fill='%230e0322'/><circle cx='50' cy='50' r='35.6' fill='url(%23p)'/><circle cx='50' cy='50' r='15' fill='url(%23h)' stroke='%230e0322' stroke-width='1.5'/><circle cx='50' cy='50' r='15.8' fill='none' stroke='%239a74ef' stroke-opacity='.55' stroke-width='.8'/><rect x='48.8' y='17' width='2.4' height='8' rx='1.2' fill='%23c4adff'/></svg>") center / 100% 100% no-repeat;
    animation: jog-spin 1.6s linear infinite;
  }
  /* The shine stays put while the wheel turns under it. */
  .jog::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 26%, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0) 42%),
      radial-gradient(circle at 70% 80%, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0) 55%);
  }
  @keyframes jog-spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .jog::before { animation-duration: 6s; } }
  /* Smaller, inside a button. */
  button .jog { width: 1.25rem; height: 1.25rem; margin: 0 0.5rem 0 0; vertical-align: -0.25em; }
</style>
<script>
  // Embedded (events?embedded): no logo, heading or background, compact rows. Phones get compact rows too.
  if (new URLSearchParams(location.search).has('embedded')) document.documentElement.classList.add('embedded', 'compact');
  const phone = matchMedia('(max-width: 560px)');
  const fit = () => document.documentElement.classList.toggle('compact', phone.matches || document.documentElement.classList.contains('embedded'));
  fit();
  phone.addEventListener('change', fit);
</script>
</head>
<body>
<main class="wrap loading">
  <header>
    <img class="logo" src="logo.png" alt="CT Open Decks">
    <h1>Upcoming events</h1>
  </header>
  <ul class="shows" id="shows" aria-live="polite" aria-busy="true"></ul>
  <p class="message" id="message" role="status"><span class="jog" aria-hidden="true"></span>Loading dates…</p>
  <p class="footnote" id="footnote" hidden>Future events will be added as we get closer.</p>
</main>
<div class="scrollbar" id="scrollbar" aria-hidden="true" hidden><div class="thumb" id="thumb"></div></div>

<script>
const CONFIG = {
  // The same Apps Script web app URL as index.html (it ends in /exec).
  apiUrl: 'https://script.google.com/macros/s/AKfycbwZntnJesyS-5fPQT9PHJyThZiSTxXhL__geIVGaDWVkGVpOe7ROJcwM9jBscPxTZfdYQ/exec',
  // Shown on every show.
  venue: 'Stella Blues · 204 Crown St, New Haven · 21+',
  // The same, short enough for the compact rows on phones and in the embed.
  venueShort: 'Stella Blues · New Haven · 21+',
  // How often it checks for changes while open, in minutes.
  refreshMinutes: 5,
};

const $ = (id) => document.getElementById(id);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

// '2026-12-09' → ['Dec', 9]
function monthDay(day) {
  const [, month, date] = day.split('-').map(Number);
  return [MONTHS[month - 1], date];
}

// "8:00 PM" → "8 PM"
const shortTime = (time) => time.replace(':00', '');

// The venue, in full on bigger screens and short in compact rows.
function venueLine() {
  const where = el('p', 'where');
  where.append(el('span', 'long', CONFIG.venue), el('span', 'short', CONFIG.venueShort));
  return where;
}

function render(data) {
  document.querySelector('.wrap').classList.remove('loading');
  $('message').hidden = true;
  const list = $('shows');
  list.removeAttribute('aria-busy');
  if (!data.shows.length) {
    list.replaceChildren();
    $('message').textContent = 'New dates coming soon.';
    $('message').hidden = false;
    $('footnote').hidden = true;
    return;
  }
  $('footnote').hidden = false;
  list.replaceChildren(...data.shows.map((show, i) => {
    const item = el('li', 'show');
    const [month, date] = monthDay(show.day);
    const day = el('div', 'day');
    day.setAttribute('aria-hidden', 'true');
    day.append(el('b', '', month), el('span', '', String(date)));
    const text = el('div', 'text');
    // The long date on bigger screens, "Wed, Dec 9" on phones.
    const when = el('p', 'when');
    when.append(el('span', 'long', show.date), el('span', 'short', `${show.date.slice(0, 3)}, ${month} ${date}`));
    if (show.start) when.append(el('span', 'time', shortTime(show.start)));
    text.append(el('h2', 'session', show.session ? `Session ${show.session}` : data.name), when, venueLine());
    item.append(day, text);
    return item;
  }));
  fitRows();
}

async function load() {
  try {
    const res = await fetch(`${CONFIG.apiUrl}?mode=events`, { cache: 'no-store' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.message);
    render(data);
  } catch (err) {
    console.error(err);
    // A failed check keeps what's on screen.
    if ($('shows').getAttribute('aria-busy')) {
      $('shows').replaceChildren();
      $('message').textContent = "Couldn't load the dates. Try again in a minute.";
      $('message').hidden = false;
    }
  }
}

// Embedded: two rows of dates always show in full (4 dates on bigger screens, 2 on phones) and the
// rest scroll inside. Tells the page around it how tall that is, and if the embed is shorter
// (a narrow phone, or bigger text settings), shrinks everything until two rows fit.
const ROWS = 2;
function rowsHeight(wrap) {
  const cards = [...document.querySelectorAll('.show')].map((card) => card.getBoundingClientRect());
  if (!cards.length) return 0;
  const rows = [...new Set(cards.map((r) => Math.round(r.top)))].sort((a, b) => a - b);
  const lastRow = rows.length > ROWS ? rows[ROWS - 1] : Infinity;
  const bottom = Math.max(...cards.filter((r) => Math.round(r.top) <= lastRow).map((r) => r.bottom));
  return Math.ceil(bottom - wrap.getBoundingClientRect().top + wrap.scrollTop) + 4;
}
function fitRows() {
  const root = document.documentElement;
  if (!root.classList.contains('embedded')) return;
  const wrap = document.querySelector('.wrap');
  root.style.fontSize = '';
  let needed = rowsHeight(wrap);
  if (needed && window.parent !== window) window.parent.postMessage({ ctodEventsHeight: needed }, '*');
  let size = parseFloat(getComputedStyle(root).fontSize);
  while (needed > wrap.clientHeight && size > 9) {
    size *= 0.95;
    root.style.fontSize = `${size}px`;
    needed = rowsHeight(wrap);
  }
  updateScrollbar();
}
addEventListener('resize', fitRows);
// The text gets a little taller once the fonts arrive.
document.fonts.ready.then(fitRows);

// Embedded: a purple scrollbar of its own that always shows while there are more dates, since
// phones hide theirs. Drag it, or tap the track to jump.
function updateScrollbar() {
  const wrap = document.querySelector('.wrap');
  const bar = $('scrollbar');
  const more = document.documentElement.classList.contains('embedded') && wrap.scrollHeight > wrap.clientHeight + 1;
  bar.hidden = !more;
  if (!more) return;
  const track = bar.clientHeight;
  const size = Math.max(track * wrap.clientHeight / wrap.scrollHeight, 24);
  $('thumb').style.height = `${size}px`;
  $('thumb').style.top = `${(track - size) * wrap.scrollTop / (wrap.scrollHeight - wrap.clientHeight)}px`;
}
document.querySelector('.wrap').addEventListener('scroll', updateScrollbar, { passive: true });
$('scrollbar').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const wrap = document.querySelector('.wrap');
  const bar = $('scrollbar');
  const rect = bar.getBoundingClientRect();
  const size = $('thumb').offsetHeight;
  const grab = e.target === $('thumb') ? e.clientY - $('thumb').getBoundingClientRect().top : size / 2;
  const move = (ev) => {
    const ratio = Math.min(1, Math.max(0, (ev.clientY - rect.top - grab) / (rect.height - size)));
    wrap.scrollTop = ratio * (wrap.scrollHeight - wrap.clientHeight);
  };
  move(e);
  bar.setPointerCapture(e.pointerId);
  bar.onpointermove = move;
  bar.onpointerup = bar.onpointercancel = () => { bar.onpointermove = null; };
});

load();
setInterval(() => { if (document.visibilityState === 'visible') load(); }, CONFIG.refreshMinutes * 60000);
</script>
</body>
</html>
